# stock-engine v101 (installed by Studio)
name: Stock Clips Video

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Base64 JSON plan written by Studio (small plans only)"
        type: string
        required: false
      plan_file:
        description: "Repo path of the JSON plan committed by Studio"
        type: string
        required: false
      premium_voice:
        description: "Use ElevenLabs voice (off = free voice)"
        type: boolean
        default: true
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: false
      post_x:
        description: "Post to X (shorts only)"
        type: boolean
        default: false
      post_bluesky:
        description: "Post to Bluesky (shorts only)"
        type: boolean
        default: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests edge-tts twikit google-auth google-auth-oauthlib google-api-python-client pillow yt-dlp
          pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install transformers || true

      - name: Remember clips used in earlier videos
        uses: actions/cache@v4
        with:
          path: /tmp/used-media
          key: used-media-${{ github.run_id }}
          restore-keys: used-media-

      - name: Cache the image-matching AI model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-vit-b32

      - name: Build the video
        env:
          PLAN: ${{ github.event.inputs.plan }}
          PLAN_FILE: ${{ github.event.inputs.plan_file }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          HIGGSFIELD_VOICE_ID: ${{ secrets.HIGGSFIELD_VOICE_ID }}
          HIGGSFIELD_TTS_MODEL: ${{ secrets.HIGGSFIELD_TTS_MODEL }}
          HIGGSFIELD_MUSIC_MODEL: ${{ secrets.HIGGSFIELD_MUSIC_MODEL }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          PREMIUM_VOICE: ${{ github.event.inputs.premium_voice }}
        run: python scripts/stock/render_stock_video.py /tmp/brand-video/daily-video.mp4

      - name: Save the plain MP4 (no zip, so browsers don't block it)
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/brand-video/daily-video.mp4
          archive: false
          retention-days: 1

      - name: Save the video as a download
        uses: actions/upload-artifact@v4
        with:
          name: stock-video
          path: |
            /tmp/brand-video/daily-video.mp4
            /tmp/brand-video/meta.json
            /tmp/brand-video/thumbnail.jpg
          retention-days: 1

      - name: Upload to YouTube
        id: youtube
        if: ${{ github.event.inputs.upload == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY || 'public' }}
        run: |
          if [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then echo "No YouTube keys - skipping."; exit 0; fi
          set -o pipefail
          python scripts/stock/upload_youtube.py /tmp/brand-video/daily-video.mp4 /tmp/brand-video/meta.json | tee /tmp/brand-video/upload.log
          URL=$(grep -o 'https://youtu.be/[A-Za-z0-9_-]*' /tmp/brand-video/upload.log | head -1)
          echo "video_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Attach generated thumbnail
        if: ${{ github.event.inputs.upload == 'true' && steps.youtube.outputs.video_url != '' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/stock/upload_thumbnail.py /tmp/brand-video/upload.log /tmp/brand-video/thumbnail.jpg

      - name: Post to X
        if: ${{ github.event.inputs.post_x == 'true' }}
        continue-on-error: true
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          VIDEO_URL: ${{ steps.youtube.outputs.video_url }}
        run: |
          DIR=scripts/youtube; [ -f $DIR/post_social.py ] || DIR=scripts/render
          python $DIR/post_social.py twitter /tmp/brand-video/meta.json /tmp/brand-video/daily-video.mp4

      - name: Post to Bluesky
        if: ${{ github.event.inputs.post_bluesky == 'true' }}
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          VIDEO_URL: ${{ steps.youtube.outputs.video_url }}
        run: |
          DIR=scripts/youtube; [ -f $DIR/post_social.py ] || DIR=scripts/render
          python $DIR/post_social.py bluesky /tmp/brand-video/meta.json /tmp/brand-video/daily-video.mp4
